# Builds the Windows Onboard on GitHub's Windows machines (nothing to install here).
# Actions → Windows build → the run → Artifacts → karots-onboard-windows (a zip:
# unzip anywhere, run karots_suite_onboard.exe).
name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: karots-onboard-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
