# Builds both Windows apps on GitHub's Windows machines (nothing to install here).
# Actions → Windows build → the run → Artifacts: karots-onboard-windows and
# karots-shelf-windows (zips: unzip anywhere, run the .exe).
name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'Makefile']
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - app: onboard
            target: lib/main.dart
            shelf: ''
          - app: shelf
            target: lib/main_shelf.dart
            shelf: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: flutter build windows
        shell: bash
        run: |
          if [ -n "${{ matrix.shelf }}" ]; then export KS_SHELF=1; fi
          flutter build windows --release -t ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: karots-${{ matrix.app }}-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
